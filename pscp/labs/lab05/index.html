<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class="ero" style="display: none; color: red;">Error</h1>
    <h2>Add new user (Post)</h2>
    <label for="name">Name:</label>
    <input type="text" id="name"><br>
    <label for="bday">Birthday:</label>
    <input type="date" id="bday" ><br>
    <button onclick="postData()">Add user</button>

    <h2>Update new (Put)</h2>
    <label for="idUpdate">ID:</label>
    <input type="text" id="idUpdate"><br>
    <button onclick="getInfo()">Get info</button>

    <label class="c" style="display: none" for="nameUpdate">Name:</label>
    <input class="c" style="display: none" type="text" id="nameUpdate"><br>
    <label class="c" style="display: none" for="bdayUpdate">Birthday:</label>
    <input class="c" style="display: none" type="date" id="bdayUpdate"><br>
    <button class="c" style="display: none" onclick="putData()">Update user</button>

    <h2>Delete user(Delete)</h2>
    <label for="idDelete">ID:</label>
    <input type="text" id="idDelete"><br>
    <button onclick="deleteData()">Delete user</button>

    <h2>Show user(Get)</h2>
    <button onclick="getData()">Show user</button>

    <div id="result"></div>
    <script>
        var today = new Date();
        var dd = String(today.getDate()).padStart(2, '0');
        var mm = String(today.getMonth() + 1).padStart(2, '0');
        var yyyy = today.getFullYear();
        today = yyyy + '-' + mm + '-' + dd;
    
        document.getElementById("bday").setAttribute("max", today);
        document.getElementById("bdayUpdate").setAttribute("max", today);
    
        const getInfo =()=>{
            const idValue = document.getElementById("idUpdate").value.trim();
            if (idValue === "") {
                document.querySelector(".ero").style.display = "block";
                document.querySelector(".ero").textContent = "Error: ID cannot be empty";
                document.querySelector(".ero").style.color = "red";
                return;
            }
            fetch('http://localhost:5000/api/db', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(response => response.json())
                .then(data => {
                    const ids = Number.parseInt(document.getElementById("idUpdate").value);
                    const index = data.findIndex(a=>a.id === ids);
                    if (index !== -1) {
                        [...document.getElementsByClassName("c")].forEach(el => {
                            el.style.display = "block";
                        })
                        document.querySelector(".ero").style.display="none";
                        document.querySelector(".ero").style.color="red";
                        document.getElementById("nameUpdate").value = data[index].name;
                        document.getElementById("bdayUpdate").value = data[index].dateOfBirth;
                    }
                    else{
                        [...document.getElementsByClassName("c")].forEach(el => {
                            errorElement.style.display = "none";
                            el.style.display = "none";
                        })
                        document.querySelector(".ero").style.display="block";
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
        const deleteData = () => {
        const id = document.getElementById("idDelete").value.trim();
        const errorElement = document.querySelector(".ero");

        if (id === "") {
            errorElement.style.display = "block";
            errorElement.textContent = "Error: ID cannot be empty";
            errorElement.style.color = "red";
            return;
        }

            fetch('http://localhost:5000/api/db', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: Number(id) }) // Передача объекта с ID
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Row not found');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById("result").innerHTML = JSON.stringify(data);
                errorElement.style.display = "none";
            })
            .catch(error => {
                errorElement.style.display = "block";
                errorElement.textContent = "Error: " + error.message;
                errorElement.style.color = "red";
                console.error('Error:', error);
            });
        }

        const getData =()=>{
            fetch('http://localhost:5000/api/db', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {document.getElementById("result").innerHTML = JSON.stringify(data);
                    errorElement.style.display = "none";
            })
            .catch(error => {
            console.error('Error:', error);
            });
        }
        const postData = () => {
        const name = document.getElementById("name").value.trim(); 
        const bday = document.getElementById("bday").value;
        const errorElement = document.querySelector(".ero"); 

        if (name === "") {
            errorElement.style.display = "block";
            errorElement.textContent = "Error: Name cannot be empty";
            errorElement.style.color = "red";
            return; 
        }

        if (bday === "") {
            errorElement.style.display = "block";
            errorElement.textContent = "Error: Birthday cannot be empty";
            errorElement.style.color = "red";
            return; 
        }

            const data = { name, bday };
            fetch('http://localhost:5000/api/db', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => { 
                document.getElementById("result").innerHTML = JSON.stringify(data);
                errorElement.style.display = "none";
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        const putData = () => {
            const id = Number.parseInt(document.getElementById("idUpdate").value.trim());
            const name = document.getElementById("nameUpdate").value.trim(); 
            const bday = document.getElementById("bdayUpdate").value;
            const errorElement = document.querySelector(".ero"); 

            if (name === "") {
                errorElement.style.display = "block";
                errorElement.textContent = "Error: Name cannot be empty";
                errorElement.style.color = "red";
                return; 
            }

            if (bday === "") {
                errorElement.style.display = "block";
                errorElement.textContent = "Error: Birthday cannot be empty";
                errorElement.style.color = "red";
                return; 
            }

            const data = { id, name, bday };
            fetch('http://localhost:5000/api/db', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("result").innerHTML = JSON.stringify(data);
                errorElement.style.display = "none"; 
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

    </script>
</body>
</html>
