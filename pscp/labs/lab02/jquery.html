<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Данные студента</h1>
    <p id="student-name">Загрузка данных...</p>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $.ajax({
                url: '/api/name',
                type: 'GET',
                success: function(data) {
                    $('#student-name').text(data);
                },
                error: function() {
                    $('#student-name').text('Ошибка при загрузке данных');
                }
            });
        });
    </script>
</body>
</html>
